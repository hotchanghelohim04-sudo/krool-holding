name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Cohérence des contenus et traductions
        run: npm test
      - run: npm run build
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend (lint, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: krool
          POSTGRES_USER: krool
          POSTGRES_PASSWORD: krool
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U krool"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://krool:krool@localhost:5432/krool
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - name: Audit des dépendances
        run: pip-audit -r requirements.txt

  docker:
    name: Docker Compose (build + démarrage de la stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Préparer un .env de test (secrets aléatoires, jamais commités)
        run: |
          cp .env.example .env
          sed -i "s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=$(openssl rand -hex 48)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
      - name: Construire et démarrer (attend les healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Vérifier l'API et le site
        run: |
          curl -fsS http://localhost:8000/api/health/
          echo
          curl -fsS -o /dev/null -w "/fr -> %{http_code}\n" http://localhost:3000/fr
          curl -sS -o /dev/null -w "/ -> %{http_code} %{redirect_url}\n" http://localhost:3000/
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - name: Arrêter la stack
        if: always()
        run: docker compose down -v

  secrets:
    name: Scan des secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Binaire gitleaks (version figée) : analyse tout l'historique à chaque exécution.
      - name: Installer gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz gitleaks
      - name: Rechercher des secrets dans l'historique Git
        run: ./gitleaks git --redact --verbose --exit-code 1 .
